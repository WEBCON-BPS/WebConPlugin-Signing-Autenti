name: Build .NET

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x       
    - name: Restore dependencies
      run: dotnet restore WebCon.Plugins.Signing.Autenti.sln
    - name: Build
      run: dotnet build WebCon.Plugins.Signing.Autenti.sln  --no-restore --configuration Release 
    - name: Copy references
      run: |
        mkdir -p "WebCon.Plugins.Signing.Autenti\bin\Release\netstandard2.0\serviceDependencies\"
        xcopy "WebCon.Plugins.Signing.Autenti\ServiceReferenceDll\*.dll" "WebCon.Plugins.Signing.Autenti\bin\Release\netstandard2.0\serviceDependencies\" /Y
    - uses: actions/upload-artifact@v4
      with:
        name: WebCon.Plugins.Signing.Autenti
        path: |
          WebCon.Plugins.Signing.Autenti/bin/Release/netstandard2.0/WebCon.Plugins.Signing.Autenti.dll
          WebCon.Plugins.Signing.Autenti/bin/Release/netstandard2.0/WebCon.Plugins.Signing.Autenti.json
          WebCon.Plugins.Signing.Autenti/bin/Release/netstandard2.0/serviceDependencies
